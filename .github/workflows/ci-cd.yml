name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  EB_APP: deployguard
  EB_ENV: deployguard-prod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t deployguard .
      - name: Container health check (API and dashboard page)
        run: |
          docker run -d --name dg -p 8000:8000 deployguard
          for _ in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health || { docker logs dg; exit 1; }
          curl -fs localhost:8000/ | grep -q "DeployGuard" || { echo "dashboard page missing"; docker logs dg; exit 1; }
          curl -fs localhost:8000/version | grep -q version || { docker logs dg; exit 1; }
          docker rm -f dg

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Format check (warning only)
        run: terraform -chdir=terraform fmt -check -diff || echo "::warning::run terraform fmt in terraform/"
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  # Runs only when the repo variable AWS_ROLE_ARN is set.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != '' }}
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Assemble bundle
        run: |
          mkdir -p bundle
          cp Dockerfile requirements.txt bundle/
          cp -r app bundle/app
          echo "${GITHUB_SHA::8}" > bundle/app/version.txt
      - name: Deploy to Elastic Beanstalk
        run: bash scripts/deploy_eb.sh "$EB_APP" "$EB_ENV" bundle /health
