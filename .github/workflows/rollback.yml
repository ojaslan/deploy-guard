name: Rollback

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: Version to roll back to. Leave empty to only LIST versions.
        required: false
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  EB_APP: deployguard
  EB_ENV: deployguard-prod

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: List or roll back
        env:
          VERSION_LABEL: ${{ inputs.version_label }}
        run: bash scripts/rollback_eb.sh "$EB_APP" "$EB_ENV" /health "$VERSION_LABEL"
